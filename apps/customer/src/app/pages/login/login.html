<app-auth-shell title="Login" [loading]="loginForm().submitting()">
  <ion-card-subtitle authSubtitle>
    <a [routerLink]="links.REGISTER"><strong>Sign In</strong></a>
    to continue
  </ion-card-subtitle>

  <form [formRoot]="loginForm" novalidate>
    <ion-item>
      <ion-icon name="mail" aria-hidden="true"></ion-icon>
      <ion-input
        type="email"
        placeholder="Enter Your Email"
        aria-label="Email"
        autocomplete="username"
        [formField]="loginForm.email"
      ></ion-input>
    </ion-item>
    <app-field-errors [field]="loginForm.email" />

    <ion-item>
      <ion-icon name="lock-closed" aria-hidden="true"></ion-icon>
      <ion-input
        type="password"
        placeholder="Enter Your Password"
        aria-label="Password"
        autocomplete="current-password"
        [formField]="loginForm.password"
      ></ion-input>
    </ion-item>
    <app-field-errors [field]="loginForm.password" />

    <div class="bottom-section">
      <ion-button type="submit">Login</ion-button>
      <span><a [routerLink]="links.FORGOT_PASSWORD">Forget Password ?</a></span>
    </div>
  </form>
</app-auth-shell>
