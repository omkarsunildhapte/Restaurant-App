<app-auth-shell title="Forget Password" [loading]="forgotForm().submitting()">
  <ion-card-subtitle authSubtitle>
    <a [routerLink]="links.LOGIN"><strong>Login In</strong></a>
    to continue
  </ion-card-subtitle>

  <form [formRoot]="forgotForm" novalidate>
    <ion-item>
      <ion-icon name="mail" aria-hidden="true"></ion-icon>
      <ion-input
        type="email"
        placeholder="Enter Your Email"
        aria-label="Email"
        autocomplete="email"
        [formField]="forgotForm.email"
      ></ion-input>
    </ion-item>
    <app-field-errors [field]="forgotForm.email" />

    <div class="bottom-section">
      <ion-button type="submit">Reset Password</ion-button>
    </div>
  </form>
</app-auth-shell>
