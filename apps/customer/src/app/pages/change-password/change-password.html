<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        [defaultHref]="links.ACCOUNT"
        icon="chevron-back-outline"
        text=""
      ></ion-back-button>
    </ion-buttons>
    <ion-title>Change Password</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <form [formRoot]="passwordForm" novalidate>
    <ion-card>
      <ion-card-content>
        <ion-list>
          <ion-item>
            <div class="flex w-full flex-col py-5">
              <span class="text-sm text-slate-300 pt-4 font-normal">Password</span>
              <ion-input
                [type]="visible().current ? 'text' : 'password'"
                class="borderInput w-full"
                aria-label="Current password"
                autocomplete="current-password"
                [formField]="passwordForm.currentPassword"
              >
                <ion-button
                  slot="end"
                  fill="clear"
                  aria-label="Show password"
                  (click)="toggle('current')"
                  ><ion-icon class="text-base" name="eye" aria-hidden="true"></ion-icon
                ></ion-button>
              </ion-input>
              <app-field-errors [field]="passwordForm.currentPassword" />
            </div>
          </ion-item>
          <ion-item>
            <div class="flex w-full flex-col py-5">
              <span class="text-sm text-slate-300 pt-4 font-normal">New Password</span>
              <ion-input
                [type]="visible().new ? 'text' : 'password'"
                class="borderInput w-full"
                aria-label="New password"
                autocomplete="new-password"
                [formField]="passwordForm.newPassword"
              >
                <ion-button
                  slot="end"
                  fill="clear"
                  aria-label="Show new password"
                  (click)="toggle('new')"
                  ><ion-icon class="text-base" name="eye" aria-hidden="true"></ion-icon
                ></ion-button>
              </ion-input>
              <app-field-errors [field]="passwordForm.newPassword" />
            </div>
          </ion-item>
          <ion-item>
            <div class="flex w-full flex-col py-5">
              <span class="text-sm text-slate-300 pt-4 font-normal">Confirm Password</span>
              <ion-input
                [type]="visible().confirm ? 'text' : 'password'"
                class="borderInput w-full"
                aria-label="Confirm password"
                autocomplete="new-password"
                [formField]="passwordForm.confirmPassword"
              >
                <ion-button
                  slot="end"
                  fill="clear"
                  aria-label="Show confirmation"
                  (click)="toggle('confirm')"
                  ><ion-icon class="text-base" name="eye" aria-hidden="true"></ion-icon
                ></ion-button>
              </ion-input>
              <app-field-errors [field]="passwordForm.confirmPassword" />
            </div>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
    <ion-button expand="block" shape="round" type="submit">Change Password</ion-button>
  </form>
  @if (passwordForm().submitting()) {
    <app-loading />
  }
</ion-content>
