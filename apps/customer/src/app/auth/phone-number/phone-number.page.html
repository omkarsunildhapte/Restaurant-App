<div class="background-pic">
  <ion-content>
    <ion-card>
      <ion-card-header>
        <div class="flex justify-center">
          <img src="brand/thaliyo-logo-600.webp" alt="Thaliyo" width="600" height="465" style="width: 60%; height: auto;" />
        </div>
        <ion-card-title>
          Add Phone Number
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="phoneNumberForm" (ngSubmit)="onSubmit()" class="flex flex-col">
          <ion-item>
            <ion-icon name="call-outline"></ion-icon>
            <ion-input placeholder="Enter Your Phone Number" formControlName="phoneNumber"></ion-input>
          </ion-item>
          @if (isSubmit && phoneNumberForm.controls['phoneNumber'].touched && phoneNumberForm.controls['phoneNumber'].errors?.['required']) {
            <div class="error-message">
              Phone Number is required.
            </div>
          }
          <div class="bottom-section">
            <ion-button type="submit">Add Number</ion-button>
          </div>
        </form>
      </ion-card-content>
    </ion-card>

  </ion-content>
</div>
