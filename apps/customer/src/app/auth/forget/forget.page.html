<div class="background-pic">
  <ion-content>
    <ion-card>
      <ion-card-header>
        <div class="flex justify-center">
          <img src="brand/thaliyo-logo-600.webp" alt="Thaliyo" width="600" height="465" style="width: 60%; height: auto;" />
        </div>
        <ion-card-title>
          Forget <br> Password
        </ion-card-title>
        <ion-card-subtitle>
          <strong routerLink="/login">Login In</strong>
          to continue
        </ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-icon name="mail"></ion-icon>
          <ion-input placeholder="Enter Your Email" [formControl]="forgetPassword"></ion-input>
        </ion-item>
        @if ( isSubmit && forgetPassword.touched) {
          <div>
            @if (forgetPassword.errors?.['required']) {
              <div class="error-message">
                Email is required.
              </div>
            }
            @if (forgetPassword.errors?.['email']) {
              <div class="error-message">
                Enter a valid email.
              </div>
            }
          </div>
        }
        <div class="bottom-section">
          <ion-button (click)="resetPassword()">Reset Password</ion-button>
        </div>
      </ion-card-content>
    </ion-card>
    @if (isLoading()) {
      <loading></loading>
    }
  </ion-content>
</div>
