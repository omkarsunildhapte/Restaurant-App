<header
  class="flex h-16 shrink-0 items-center gap-3 border-b border-ink-200 bg-white/90 px-4 backdrop-blur sm:px-6 dark:border-ink-800 dark:bg-ink-950/90"
>
  <!-- Mobile drawer trigger -->
  <button
    type="button"
    (click)="layout.openMobile()"
    class="grid size-9 place-items-center rounded-lg text-ink-500 transition-colors hover:bg-ink-100 hover:text-ink-900 focus-visible:outline-2 focus-visible:outline-brand-500 lg:hidden dark:text-ink-400 dark:hover:bg-ink-800 dark:hover:text-white"
    aria-label="Open navigation"
  >
    <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
    </svg>
  </button>

  <div class="ml-auto flex items-center gap-1">
    <!-- Theme toggle -->
    <button
      type="button"
      (click)="layout.toggleTheme()"
      class="grid size-9 place-items-center rounded-lg text-ink-500 transition-colors hover:bg-ink-100 hover:text-ink-900 focus-visible:outline-2 focus-visible:outline-brand-500 dark:text-ink-400 dark:hover:bg-ink-800 dark:hover:text-white"
      [attr.aria-label]="layout.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      @if (layout.isDark()) {
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
      } @else {
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      }
    </button>

    <div class="mx-1 hidden h-6 w-px bg-ink-200 sm:block dark:bg-ink-800"></div>

    <!-- Account -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu()"
        class="flex items-center gap-2 rounded-lg py-1.5 pl-1.5 pr-2 transition-colors hover:bg-ink-100 focus-visible:outline-2 focus-visible:outline-brand-500 dark:hover:bg-ink-800"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
      >
        <span class="grid size-8 place-items-center rounded-full bg-ink-900 text-xs font-semibold text-white dark:bg-brand-600">{{ auth.initials() }}</span>
        <span class="hidden text-left sm:block">
          <span class="block text-sm font-medium leading-tight text-ink-900 dark:text-white">{{ auth.user()?.name ?? 'Thaliyo' }}</span>
          <span class="block max-w-[150px] truncate text-xs leading-tight text-ink-500 dark:text-ink-400">{{ auth.user()?.role === 'admin' ? 'Admin' : 'Sales' }} · {{ auth.user()?.email }}</span>
        </span>
      </button>

      @if (menuOpen()) {
        <div
          class="absolute right-0 top-full z-30 mt-2 w-48 rounded-xl border border-ink-200 bg-white p-1.5 shadow-lg dark:border-ink-800 dark:bg-ink-900"
          role="menu"
        >
          <button
            type="button"
            role="menuitem"
            (click)="signOut()"
            class="block w-full rounded-lg px-3 py-2 text-left text-sm text-ink-700 transition-colors hover:bg-ink-100 dark:text-ink-200 dark:hover:bg-ink-800"
          >
            Sign out
          </button>
        </div>
      }
    </div>
  </div>
</header>
