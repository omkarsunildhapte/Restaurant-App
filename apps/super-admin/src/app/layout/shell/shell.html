<div class="flex h-dvh overflow-hidden bg-ink-50 dark:bg-ink-900">
  <!-- Desktop rail -->
  <div class="hidden shrink-0 lg:block">
    <app-sidebar />
  </div>

  <!-- Mobile drawer -->
  @if (layout.mobileOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <button
        type="button"
        class="absolute inset-0 size-full bg-ink-900/50 backdrop-blur-sm"
        aria-label="Close navigation"
        (click)="layout.closeMobile()"
      ></button>
      <div class="absolute inset-y-0 left-0 w-64 shadow-xl">
        <app-sidebar [forceExpanded]="true" />
      </div>
    </div>
  }

  <!-- Content column -->
  <div class="flex min-w-0 flex-1 flex-col">
    <app-header />
    <main class="flex-1 overflow-y-auto">
      <div class="w-full px-3 py-5 sm:px-4">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
