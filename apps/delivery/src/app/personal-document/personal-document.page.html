<ion-header>
  <ion-toolbar>
    <ion-icon name="chevron-back-outline" aria-hidden="true" slot="start"></ion-icon>
    <ion-title>Personal Document</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <form [formGroup]="documentForm" (ngSubmit)="submit()">
    @for (document of documents; track document) {
      <ion-card>
        <ion-card-content class="document-card">
          @if (!document.value) {
            <label for="{{ document.id }}" class="document-label">
              <ion-icon name="cloud-upload" size="large"></ion-icon>
              <div>{{ document.label }}</div>
              <input type="file" id="{{ document.id }}" accept="image/*" hidden formControlName="{{ document.name }}" (change)="onFileSelected($event, document.name)">
              @if (!documentForm.get(document.name)?.value) {
                <span>{{ document.placeholder }}</span>
              }
            </label>
          }
          @if (documentForm.get(document.name)?.value) {
            <ion-img id="preview-{{ document.name }}" alt="Preview" [src]="$safeNavigationMigration(documentForm.get(document.name)?.value)">
            </ion-img>
          }
          @if (documentForm.get(document.name)?.value) {
            <ion-button expand="block" class="clear-button" (click)="resetFileInput(document.name)">Clear</ion-button>
          }
        </ion-card-content>
      </ion-card>
    }
    <div class="bottom-section">
      <ion-button type="submit">Upload</ion-button>
      <span>
        Need help? <a href="#">Contact Support</a>
      </span>
    </div>
  </form>
  @if (isLoader()) {
    <loading></loading>
  }
</ion-content>
