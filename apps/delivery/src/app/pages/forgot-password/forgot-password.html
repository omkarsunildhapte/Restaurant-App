<div class="background-pic">
  <ion-content>
    <ion-card>
      <ion-card-header>
        <div class="flex justify-center">
          <img
            class="logo"
            [ngSrc]="logo.SRC"
            [alt]="logo.ALT"
            [width]="logo.WIDTH"
            [height]="logo.HEIGHT"
            priority
          />
        </div>
        <ion-card-title>Forget <br />Password</ion-card-title>
        <ion-card-subtitle>
          <a [routerLink]="links.LOGIN"><strong>Login In</strong></a>
          to continue
        </ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <form [formRoot]="forgotForm" novalidate>
          <ion-item>
            <ion-icon name="mail" aria-hidden="true"></ion-icon>
            <ion-input
              type="email"
              placeholder="Enter Your Email"
              aria-label="Enter Your Email"
              autocomplete="email"
              data-testid="forgot-email"
              [formField]="forgotForm.email"
            ></ion-input>
          </ion-item>
          <app-field-errors
            [show]="forgotForm.email().touched()"
            [errors]="forgotForm.email().errors()"
          />
          <div class="bottom-section">
            <ion-button type="submit" data-testid="forgot-submit">Reset Password</ion-button>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
    @if (forgotForm().submitting()) {
      <app-loader />
    }
  </ion-content>
</div>
