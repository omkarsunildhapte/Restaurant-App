<div class="background-pic">
  <ion-content>
    <ion-card>
      <ion-card-header>
        <div class="flex justify-center">
          <img
            class="logo"
            [ngSrc]="logo.SRC"
            [alt]="logo.ALT"
            [width]="logo.WIDTH"
            [height]="logo.HEIGHT"
            priority
          />
        </div>
        <ion-card-title>Create New Account</ion-card-title>
        <ion-card-subtitle>
          Already registered?
          <a [routerLink]="links.LOGIN"><strong>Login</strong></a>
        </ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <form [formRoot]="registerForm" novalidate>
          <ion-item>
            <ion-icon name="person" aria-hidden="true"></ion-icon>
            <ion-input
              placeholder="Full Names"
              aria-label="Full Names"
              autocomplete="name"
              data-testid="register-name"
              [formField]="registerForm.name"
            ></ion-input>
          </ion-item>
          <app-field-errors
            [show]="registerForm.name().touched()"
            [errors]="registerForm.name().errors()"
          />
          <ion-item>
            <ion-icon name="mail" aria-hidden="true"></ion-icon>
            <ion-input
              type="email"
              placeholder="Email"
              aria-label="Email"
              autocomplete="email"
              data-testid="register-email"
              [formField]="registerForm.email"
            ></ion-input>
          </ion-item>
          <app-field-errors
            [show]="registerForm.email().touched()"
            [errors]="registerForm.email().errors()"
          />
          <ion-item>
            <ion-icon name="lock-closed" aria-hidden="true"></ion-icon>
            <ion-input
              type="password"
              placeholder="Password"
              aria-label="Password"
              autocomplete="new-password"
              data-testid="register-password"
              [formField]="registerForm.password"
            ></ion-input>
          </ion-item>
          <app-field-errors
            [show]="registerForm.password().touched()"
            [errors]="registerForm.password().errors()"
          />
          <ion-item>
            <ion-icon name="lock-closed" aria-hidden="true"></ion-icon>
            <ion-input
              type="password"
              placeholder="Confirm Password"
              aria-label="Confirm Password"
              autocomplete="new-password"
              data-testid="register-confirm"
              [formField]="registerForm.confirmPassword"
            ></ion-input>
          </ion-item>
          <app-field-errors
            [show]="registerForm.confirmPassword().touched()"
            [errors]="registerForm.confirmPassword().errors()"
          />
          <div class="bottom-section">
            <ion-button type="submit" data-testid="register-submit">Register</ion-button>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
    @if (registerForm().submitting()) {
      <app-loader />
    }
  </ion-content>
</div>
