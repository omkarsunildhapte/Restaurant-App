<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thaliyo Staff</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="brand/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/icon-180.png">
  <meta name="theme-color" content="#E8891F">
  <meta name="description" content="Waiter ordering, kitchen display and POS billing."/>
  <meta name="robots" content="noindex, nofollow"/>
  <script>
    // Apply the stored theme before first paint so the page never flashes light.
    try {
      if (localStorage.getItem('rp-staff.theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
